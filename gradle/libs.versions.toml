[versions]
minecraft = "26.3"
fabric-loader = "0.20.1"
fabric-api = "0.165.0+26.3"
fabric-loom = "1.19-SNAPSHOT"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-loader-junit = { module = "net.fabricmc:fabric-loader-junit", version.ref = "fabric-loader" }
fabric-loom-plugin = { module = "net.fabricmc.fabric-loom:net.fabricmc.fabric-loom.gradle.plugin", version.ref = "fabric-loom" }
foojay-resolver-convention-plugin = { module = "org.gradle.toolchains.foojay-resolver-convention:org.gradle.toolchains.foojay-resolver-convention.gradle.plugin", version = "1.0.0" }
viaversion-common = { module = "com.viaversion:viaversion-common", version = "5.12.3-SNAPSHOT" }
viabackwards-common = { module = "com.viaversion:viabackwards-common", version = "5.12.3-SNAPSHOT" }
viaaprilfools-common = { module = "com.viaversion:viaaprilfools-common", version = "4.2.4-SNAPSHOT" }
vialegacy = { module = "net.raphimc:ViaLegacy", version = "3.1.1-SNAPSHOT" }
reflect = { module = "net.lenni0451:Reflect", version = "1.6.4" }
classic4j = { module = "de.florianreuth:classic4j", version = "2.3.1" }
modmenu = { module = "com.terraformersmc:modmenu", version = "21.0.0" }
# Bedrock Edition support (ViaBedrock integration, merged in-tree from viafabricplus-bedrock)
viabedrock = { module = "net.raphimc:ViaBedrock", version = "0.0.29-20260720.172239-5" }
minecraftauth = { module = "net.raphimc:MinecraftAuth", version = "5.0.2" }
# 模型互转库：从 libs/maven 本地仓库解析（vendored 自 jitpack 的 abecffaaea）
cubeconverter = { module = "com.github.oryxel1:CubeConverter", version = "abecffaaea" }
netty-transport-raknet = { module = "org.cloudburstmc.netty:netty-transport-raknet", version = "2.0.0.CR6-20261030.131938-23" }
netty-transport-nethernet = { module = "org.cloudburstmc.netty:netty-transport-nethernet", version = "2.0.0.CR6-20261030.131938-23" }
libdatachannel-java-arch-detect = { module = "dev.opencollab:libdatachannel-java-arch-detect", version = "0.24.6.0-20261029.091642-10" }

# Versions of the Fabric API modules below are managed by the BOM.
fabric-api-bom = { module = "net.fabricmc.fabric-api:fabric-api-bom", version.ref = "fabric-api" }
fabric-api-base = { module = "net.fabricmc.fabric-api:fabric-api-base" }
fabric-resource-loader-v1 = { module = "net.fabricmc.fabric-api:fabric-resource-loader-v1" }
fabric-resource-loader-v0 = { module = "net.fabricmc.fabric-api:fabric-resource-loader-v0" }
fabric-networking-api-v1 = { module = "net.fabricmc.fabric-api:fabric-networking-api-v1" }
fabric-command-api-v2 = { module = "net.fabricmc.fabric-api:fabric-command-api-v2" }
fabric-lifecycle-events-v1 = { module = "net.fabricmc.fabric-api:fabric-lifecycle-events-v1" }
fabric-particles-v1 = { module = "net.fabricmc.fabric-api:fabric-particles-v1" }
fabric-registry-sync-v0 = { module = "net.fabricmc.fabric-api:fabric-registry-sync-v0" }
